name: complete_env

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:

# seurat
  - r-seurat=5.5.0
  - bioconductor-glmGamPoi
  - r-devtools
  - r-hdf5r

# h5ad converter
  - bioconductor-zellkonverter
  - bioconductor-singlecellexperiment
  - bioconductor-summarizedexperiment
  - bioconductor-hdf5array
  - r-reticulate

# Python backend for AnnData
  - anndata
  - h5py
  - numpy
  - scipy
  - pandas
  - pip

# immcantation
  - presto
  - biopython
  - muscle
  - seqtk
  - changeo
  - airr=1.6.1
  - igblast
  - bioconductor-ggtree
  - bioconductor-pwalign

# Bioconductor dependencies needed by alakazam/shazam/etc.
  - bioconductor-biostrings
  - bioconductor-iranges
  - bioconductor-genomicalignments

# core R / plotting
  - r-tidyverse
  - r-patchwork
  - r-rcolorbrewer
  - r-stringi
  - r-future
  - r-remotes
  - bioconductor-limma
  - bioconductor-edger
  - bioconductor-enhancedvolcano
  - bioconductor-msigdb
  - r-msigdbr
  - bioconductor-gsva
  - bioconductor-ucell
  - r-rstatix

# spatial functions
  - r-forcats
  - r-scales
  - bioconductor-annotationdbi
  - bioconductor-clusterprofiler
  - bioconductor-org.hs.eg.db
  - r-future
  - r-pheatmap
  - r-ggdendro
  - r-cowplot
